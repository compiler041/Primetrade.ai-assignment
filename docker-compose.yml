services:
  nginx:
    image: nginx:1.17
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 8000:80
    depends_on:
      - backend
      - frontend

  redis:
    image: redis
    ports:
      - 6379:6379

  postgres:
    image: postgres:12
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data:cached

  worker:
    build:
      context: backend
      dockerfile: Dockerfile
    command: celery --app app.celery_tasks worker --loglevel=DEBUG -Q main-queue -c 1
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/appdb
      SECRET_KEY: docker-secret-key
      TEST_USERNAME: admin
      TEST_PASSWORD: admin
      CORS_ORIGINS: http://localhost:8000
    depends_on:
      - postgres
      - redis

  flower:
    image: mher/flower
    command: celery flower --broker=redis://redis:6379/0 --port=5555
    ports:
      - 5555:5555
    depends_on:
      - redis

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    command: /bin/bash /app/start.sh
    ports:
      - 8888:8888
    tty: true
    volumes:
      - ./backend:/app/:cached
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://postgres:password@postgres:5432/appdb
      SECRET_KEY: docker-secret-key
      TEST_USERNAME: admin
      TEST_PASSWORD: admin
      CORS_ORIGINS: http://localhost:8000,http://localhost:3000
    depends_on:
      - postgres

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    stdin_open: true
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - REACT_APP_BASE_API_URL=http://localhost:8000/api


volumes:
  db-data:
